[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "anzer"
version = "0.1.0"
description = "Compiler for the Anzer authoring language"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/AnzerAyoob/anzer"
Issues = "https://github.com/AnzerAyoob/anzer/issues"

[project.scripts]
anzer = "anzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
