[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anzer"
version = "0.1.0"
description = "Compiler for the Anzer authoring language"
requires-python = ">=3.10"

[project.scripts]
anzer = "anzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
